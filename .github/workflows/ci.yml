name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux - Build + Vet + Race + Bench
    runs-on: ubuntu-latest
    env:
      CC: clang-21
      CXX: clang++-21
      CGO_CXXFLAGS: -nostdinc++
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod sets only the go 1.27 minimum. The committed V8 snapshot
          # activates only on the Go release named in js/snapshot_manifest.json.
          go-version-file: go.mod
          cache: true

      - name: Install LLVM Clang 21
        # V8 is built against Chromium's libc++, so the v8go binding needs
        # LLVM Clang >= 21 with -nostdinc++ on Linux (docs: Build and Run).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lsb-release wget software-properties-common gnupg
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          clang++-21 --version

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race -count=1 -p 1 -timeout 600s ./...

      - name: Bench (smoke)
        run: go test -bench=. -benchmem -run='^$' -benchtime=1x ./...

  test-macos-arm64:
    name: macOS Apple Silicon - Build + Vet + Race
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # go.mod sets only the go 1.27 minimum. The committed V8 snapshot
          # activates only on the Go release named in js/snapshot_manifest.json.
          go-version-file: go.mod
          cache: true

      - name: Install C toolchain
        run: |
          brew install --quiet autoconf automake libtool || true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Snapshot manifest
        # The committed V8 snapshot is generated on darwin/arm64 — the
        # regen-check is toolchain/arch-bound and only meaningful here.
        run: go run ./cmd/artemis-snapshot --check

      - name: Race test
        run: go test -race -count=1 -p 1 -timeout 600s ./...

