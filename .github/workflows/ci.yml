name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux - Build + Vet + Race + Bench
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Install C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race -count=1 -p 1 -timeout 600s ./...

      - name: Bench (smoke)
        run: go test -bench=. -benchmem -run='^$' -benchtime=1x ./...

  test-macos-arm64:
    name: macOS Apple Silicon - Build + Vet + Race
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Install C toolchain
        run: |
          brew install --quiet autoconf automake libtool || true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race -count=1 -p 1 -timeout 600s ./...

