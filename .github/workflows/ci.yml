name: CI

# Pushes and pull requests run the build and the tests only. The heavier
# checks run on manual dispatch through full.yml.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test-linux:
    name: Linux - Build + Test
    runs-on: ubuntu-latest
    env:
      CC: clang-21
      CXX: clang++-21
      CGO_CXXFLAGS: -nostdinc++
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # The latest Go 1.27 patch: js/snapshot_manifest.json binds the
          # committed V8 snapshot to the go1.27 release line, not a patch.
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Install LLVM Clang 21
        # V8 is built against Chromium's libc++, so the v8go binding needs
        # LLVM Clang >= 21 with -nostdinc++ on Linux (docs: Build and Run).
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential lsb-release wget software-properties-common gnupg
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 21
          clang++-21 --version

      - name: gofmt
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "unformatted files:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -vet=off -count=1 -p 1 -timeout 600s ./...

  test-macos-arm64:
    name: macOS Apple Silicon (${{ matrix.os }}) - Build + Test
    # The oldest supported macOS release and the newest runner image.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          # The latest Go 1.27 patch: js/snapshot_manifest.json binds the
          # committed V8 snapshot to the go1.27 release line, not a patch.
          go-version: '1.27.x'
          check-latest: true
          cache: true

      - name: Install C toolchain
        run: |
          brew install --quiet autoconf automake libtool || true

      - name: Build
        run: go build ./...

      - name: Snapshot manifest
        # The committed V8 snapshot is generated on darwin/arm64 — the
        # regen-check is toolchain/arch-bound and only meaningful here.
        run: go run ./cmd/artemis-snapshot --check

      - name: Test
        run: go test -vet=off -count=1 -p 1 -timeout 600s ./...

